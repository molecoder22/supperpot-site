# Two jobs in one daily run.
#
# 1. Keeps the Supabase project awake — the free tier pauses after about a week of no traffic, and a paused
#    project means no AI recipes, no sign-in and no subscriptions.
# 2. Checks that the paid API keys still work. Both vendors have a free endpoint that only answers to a valid
#    key, so this costs nothing and still catches a key that expired, was revoked, or ran out of credit —
#    before a customer does. A red run emails Mário.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Supperpot server
        run: |
          code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 30 -X POST \
            "https://zpmyortbriyaktfvosqn.supabase.co/functions/v1/generate" \
            -H "Content-Type: application/json" \
            -d '{"kind":"status","device":"keepalive-github"}')
          echo "HTTP $code"; cat /tmp/body; echo
          if [ "$code" != "200" ]; then
            echo "::error::Supperpot server answered $code — the project may be paused or down."
            exit 1
          fi

      - name: Check the AI keys are still alive
        run: |
          code=$(curl -sS -o /tmp/health -w "%{http_code}" --max-time 60 -X POST \
            "https://zpmyortbriyaktfvosqn.supabase.co/functions/v1/generate" \
            -H "Content-Type: application/json" \
            -d '{"kind":"health"}')
          echo "HTTP $code"; cat /tmp/health; echo
          if [ "$code" != "200" ]; then
            echo "::error::An AI key is dead or out of credit. Recipes and photo scanning are DOWN for every user. See the line above for which vendor."
            exit 1
          fi
