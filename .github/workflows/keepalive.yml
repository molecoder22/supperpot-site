# Supperpot's database lives on Supabase's free tier, which pauses a project after about a week with no traffic.
# A paused project means no AI recipes, no sign-in and no subscriptions — so this calls the server once a day to
# keep it awake until real users do it for us. The status call is anonymous and returns no personal data, which is
# why there is no secret here.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Supperpot server
        run: |
          code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 30 -X POST \
            "https://zpmyortbriyaktfvosqn.supabase.co/functions/v1/generate" \
            -H "Content-Type: application/json" \
            -d '{"kind":"status","device":"keepalive-github"}')
          echo "HTTP $code"
          cat /tmp/body
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Supperpot server answered $code — the project may be paused or down."
            exit 1
          fi
